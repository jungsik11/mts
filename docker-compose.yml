services:
  postgres-primary:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: mts-postgres-primary
    restart: always
    environment:
      POSTGRES_POSTGRES_PASSWORD: admin_password
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_password
      POSTGRES_DB: mts_db
      REPMGR_PASSWORD: repmgr_password
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_PRIMARY_PORT: 5432
      REPMGR_PARTNER_NODES: postgres-primary,postgres-replica
      REPMGR_NODE_NAME: postgres-primary-1
      REPMGR_NODE_ID: 1
      REPMGR_NODE_NETWORK_NAME: postgres-primary
    volumes:
      - ./infrastructure/db/primary:/bitnami/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres-replica:
    image: bitnamilegacy/postgresql-repmgr:15
    container_name: mts-postgres-replica
    restart: always
    environment:
      POSTGRES_POSTGRES_PASSWORD: admin_password
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_password
      POSTGRES_DB: mts_db
      REPMGR_PASSWORD: repmgr_password
      REPMGR_PRIMARY_HOST: postgres-primary
      REPMGR_PRIMARY_PORT: 5432
      REPMGR_PARTNER_NODES: postgres-primary,postgres-replica
      REPMGR_NODE_NAME: postgres-replica-2
      REPMGR_NODE_ID: 2
      REPMGR_NODE_NETWORK_NAME: postgres-replica
    volumes:
      - ./infrastructure/db/replica:/bitnami/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  pgpool:
    image: bitnamilegacy/pgpool:4
    container_name: mts-pgpool
    restart: always
    environment:
      PGPOOL_BACKEND_NODES: 0:postgres-primary:5432,1:postgres-replica:5432
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr_password
      PGPOOL_ENABLE_LOAD_BALANCING: yes
      PGPOOL_POSTGRES_USERNAME: mts_user
      PGPOOL_POSTGRES_PASSWORD: mts_password
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: admin_password 
      PGPOOL_HEALTH_CHECK_USER: mts_user
      PGPOOL_HEALTH_CHECK_PASSWORD: mts_password
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: 5
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: 5
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=mts_password psql -h localhost -U mts_user -d mts_db -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis-primary:
    image: redis:7-alpine
    container_name: mts-redis-primary
    restart: always
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/redis/primary_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  redis-secondary:
    image: redis:7-alpine
    container_name: mts-redis-secondary
    restart: always
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/redis/secondary_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  account-server:
    image: oliver173/mts-account:latest
    build: ./account_server_kt
    platform: linux/amd64
    container_name: mts-account-server
    depends_on:
      pgpool:
        condition: service_healthy
    ports:
      - "9000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgpool:5432/mts_db
      SPRING_DATASOURCE_USERNAME: mts_user
      SPRING_DATASOURCE_PASSWORD: mts_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  trading-server:
    image: oliver173/mts-trading:latest
    build: ./trading_server_kt
    platform: linux/amd64
    container_name: mts-trading-server
    depends_on:
      redis-primary:
        condition: service_healthy
      account-server:
        condition: service_started
    ports:
      - "9001:8001"
    environment:
      SPRING_DATA_REDIS_HOST: redis-primary
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_SECONDARY_HOST: redis-secondary
      REDIS_SECONDARY_PORT: 6379
      LEDGER_URL: http://account-server:8000
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  price-generator:
    image: oliver173/mts-price-generator:latest
    build:
      context: ./simulation
      dockerfile: Dockerfile.gen
    platform: linux/amd64
    container_name: mts-price-generator
    depends_on:
      redis-primary:
        condition: service_healthy
    environment:
      REDIS_PRIMARY_HOST: redis-primary
      REDIS_SECONDARY_HOST: redis-secondary
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  trading-bot:
    image: oliver173/mts-trading-bot:latest
    build:
      context: ./simulation
      dockerfile: Dockerfile.bot
    platform: linux/amd64
    container_name: mts-trading-bot
    depends_on:
      trading-server:
        condition: service_started
    environment:
      REDIS_PRIMARY_HOST: redis-primary
      REDIS_SECONDARY_HOST: redis-secondary
      TRADING_SERVER_URL: http://trading-server:8001/order
      ACCOUNT_SERVER_URL: http://account-server:8000/assets
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  admin-web:
    image: oliver173/mts-admin:latest
    build:
      context: ./admin_web
    platform: linux/amd64
    container_name: mts-admin-web
    ports:
      - "3000:80"
    depends_on:
      - account-server
      - trading-server
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  trade-verifier:
    image: oliver173/mts-trade-verifier:latest
    build:
      context: ./simulation
      dockerfile: Dockerfile.verifier
    platform: linux/amd64
    container_name: mts-trade-verifier
    depends_on:
      redis-primary:
        condition: service_healthy
      trading-server:
        condition: service_started
    ports:
      - "9002:8002"
    environment:
      REDIS_PRIMARY_HOST: redis-primary
      REDIS_SECONDARY_HOST: redis-secondary
      TRADING_SERVER_URL: http://trading-server:8001
      ACCOUNT_SERVER_URL: http://account-server:8000
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M


