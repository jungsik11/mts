services:
  postgres:
    image: postgres:15-alpine
    container_name: mts-postgres
    restart: always
    environment:
      POSTGRES_USER: mts_user
      POSTGRES_PASSWORD: mts_password
      POSTGRES_DB: mts_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mts_user -d mts_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/db/data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis-primary:
    image: redis:7-alpine
    container_name: mts-redis-primary
    restart: always
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/redis/primary_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  redis-secondary:
    image: redis:7-alpine
    container_name: mts-redis-secondary
    restart: always
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./infrastructure/redis/secondary_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  account-server:
    image: oliver173/mts-account:latest
    build: ./account_server_kt
    container_name: mts-account-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mts_db
      SPRING_DATASOURCE_USERNAME: mts_user
      SPRING_DATASOURCE_PASSWORD: mts_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  trading-server:
    image: oliver173/mts-trading:latest
    build: ./trading_server_kt
    container_name: mts-trading-server
    depends_on:
      redis-primary:
        condition: service_healthy
      account-server:
        condition: service_started
    ports:
      - "9001:8001"
    environment:
      SPRING_DATA_REDIS_HOST: redis-primary
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_SECONDARY_HOST: redis-secondary
      REDIS_SECONDARY_PORT: 6379
      LEDGER_URL: http://account-server:8000
      JAVA_TOOL_OPTIONS: "-Xms192m -Xmx192m -XX:+UseSerialGC"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  price-generator:
    image: oliver173/mts-price-generator:latest
    build:
      context: ./simulation
      dockerfile: Dockerfile.gen
    container_name: mts-price-generator
    depends_on:
      redis-primary:
        condition: service_healthy
    environment:
      REDIS_PRIMARY_HOST: redis-primary
      REDIS_SECONDARY_HOST: redis-secondary
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  trading-bot:
    image: oliver173/mts-trading-bot:latest
    build:
      context: ./simulation
      dockerfile: Dockerfile.bot
    container_name: mts-trading-bot
    depends_on:
      trading-server:
        condition: service_started
    environment:
      REDIS_PRIMARY_HOST: redis-primary
      REDIS_SECONDARY_HOST: redis-secondary
      TRADING_SERVER_URL: http://trading-server:8001/order
      ACCOUNT_SERVER_URL: http://account-server:8000/assets
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  admin-web:
    image: oliver173/mts-admin:latest
    build:
      context: ./admin_web
      args:
        VITE_ACCOUNT_SERVER_URL: http://account-server:8000
        VITE_TRADING_SERVER_URL: http://trading-server:8001
    container_name: mts-admin-web
    ports:
      - "3000:80"
    depends_on:
      - account-server
      - trading-server
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
